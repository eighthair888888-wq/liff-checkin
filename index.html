<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時定位簽到系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #6c757d;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #6c757d !important;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #statusMessage {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .success {
      color: #28a745;
      font-weight: bold;
    }
    .error {
      color: #dc3545;
      font-weight: bold;
    }
    .info {
      color: #17a2b8;
    }
    .notice {
      font-size: 12px;
      color: #8c98a4;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 快速簽到系統</h2>
    <div class="form-group">
      <label for="username">請輸入您的姓名</label>
      <input type="text" id="username" placeholder="例：8號髮粧" required>
    </div>
    <button id="checkInBtn" onclick="submitCheckIn()">獨立定位簽到</button>
    <div id="statusMessage"></div>
    <div class="notice">🔒 裝置單日限制：同一支手機每日僅能簽到一次</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzL0vgl08jeZzpNYn7rmhc_pGWTB0wXMpXhqjbA4sPPmIAEG5GvzOv0gWDABor8L3ZN/exec";

    // 取得今天日期的字串 (YYYY-MM-DD)
    function getTodayString() {
      const today = new Date();
      return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    }

    // Cookie 寫入工具（有效期限設為到今天深夜 23:59:59）
    function setDailyCookie(name, value) {
      const now = new Date();
      const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${midnight.toUTCString()}; path=/; SameSite=Lax`;
    }

    // Cookie 讀取工具
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
      return null;
    }

    // 鎖定按鈕與輸入框
    function lockUI(msg) {
      const btn = document.getElementById("checkInBtn");
      const usernameInput = document.getElementById("username");
      const statusDiv = document.getElementById("statusMessage");

      btn.disabled = true;
      usernameInput.disabled = true;
      if (msg) {
        statusDiv.className = "info";
        statusDiv.innerHTML = msg;
      }
    }

    // 檢查這台手機今天是否已經按過按鈕
    function checkIfLockedToday() {
      const today = getTodayString();
      const cookieDate = getCookie("device_last_checkin_date");
      const localDate = localStorage.getItem("device_last_checkin_date");

      // 雙重檢查：Cookie 或 LocalStorage 只要任一記錄為今天，就代表這台手機今天按過了
      if (cookieDate === today || localDate === today) {
        const savedUser = getCookie("device_last_user") || localStorage.getItem("device_last_user") || "";
        if (savedUser) {
          document.getElementById("username").value = savedUser;
        }
        lockUI(`🔒 這台手機今日已完成簽到！更換姓名也無法再次簽到。`);
        return true;
      }
      return false;
    }

    // 頁面開啟時自動執行檢測
    window.onload = function() {
      checkIfLockedToday();
    };

    function submitCheckIn() {
      // 點擊瞬間先再次確認這台手機今天是否已被鎖定
      if (checkIfLockedToday()) {
        return;
      }

      const usernameInput = document.getElementById("username");
      const statusDiv = document.getElementById("statusMessage");
      const username = usernameInput.value.trim();

      if (!username) {
        alert("請輸入姓名！");
        return;
      }

      if (!navigator.geolocation) {
        alert("您的裝置不支援 GPS 定位功能。");
        return;
      }

      // 【關鍵行為】：只要一點擊「獨立定位簽到」，不論後續成功與否、更換什麼姓名，立刻把這台手機標記為「今天已使用」
      const today = getTodayString();
      setDailyCookie("device_last_checkin_date", today);
      setDailyCookie("device_last_user", username);
      localStorage.setItem("device_last_checkin_date", today);
      localStorage.setItem("device_last_user", username);

      // 立即將介面鎖死反灰
      lockUI();

      statusDiv.className = "info";
      statusDiv.innerHTML = "正在獲取 GPS 定位資訊中...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const deviceId = getCookie("device_fingerprint") || localStorage.getItem("device_fingerprint") || "DEV-Mobile";

          statusDiv.innerHTML = "驗證定位中...";

          const requestUrl = `${WEB_APP_URL}?username=${encodeURIComponent(username)}&lat=${lat}&lng=${lng}&device=${encodeURIComponent(deviceId)}`;

          fetch(requestUrl)
            .then(response => response.json())
            .then(data => {
              if (data.status === "success" && data.isSuccess) {
                statusDiv.className = "success";
                statusDiv.innerHTML = `✅ ${data.message} (距離標的物約 ${data.distance} 公尺)`;
              } else {
                statusDiv.className = "error";
                statusDiv.innerHTML = `❌ ${data.message || '簽到失敗'}`;
              }
            })
            .catch(error => {
              console.error("Fetch error:", error);
              statusDiv.className = "error";
              statusDiv.innerHTML = "❌ 傳輸失敗，但本手機今日簽到次數已使用完畢。";
            });
        },
        function(error) {
          statusDiv.className = "error";
          statusDiv.innerHTML = "❌ 無法獲取定位，本手機今日簽到次數已使用完畢。";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
