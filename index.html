<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時定位簽到系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #6c757d;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #6c757d !important;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #statusMessage {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .debug-info {
      margin-top: 10px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 12px;
      color: #6c757d;
      text-align: left;
      word-break: break-all;
    }
    .success {
      color: #28a745;
      font-weight: bold;
    }
    .error {
      color: #dc3545;
      font-weight: bold;
    }
    .info {
      color: #17a2b8;
    }
    .notice {
      font-size: 12px;
      color: #8c98a4;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 快速報到系統</h2>
    <div class="form-group">
      <label for="username">請輸入您的姓名</label>
      <input type="text" id="username" placeholder="例：8號髮粧" required>
    </div>
    <button id="checkInBtn" onclick="submitCheckIn()">獨立定位報到</button>
    <div id="statusMessage"></div>
    <div id="debugBox" class="debug-info" style="display:none;"></div>
    <div class="notice">🔒 雙重防護：本裝置每日僅可報到一次 (限距離 20 公尺內)</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzWzzcqDBQYPjUzmbWtLaNZHv9l_HGUlPW8maaVSC1vVhAhIxUeuRlFJb8sPjHqJQTU/exec";

    function getTodayString() {
      const today = new Date();
      return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    }

    function getHardwareFingerprint() {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      let renderer = "unknown";
      if (gl) {
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
          renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        }
      }
      
      const str = [
        navigator.userAgent,
        screen.height,
        screen.width,
        screen.colorDepth,
        renderer
      ].join('||');

      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash |= 0;
      }
      return 'DEV-' + Math.abs(hash).toString(36);
    }

    function lockUI(msg) {
      const btn = document.getElementById("checkInBtn");
      const usernameInput = document.getElementById("username");
      const statusDiv = document.getElementById("statusMessage");

      btn.disabled = true;
      usernameInput.disabled = true;
      if (msg) {
        statusDiv.className = "info";
        statusDiv.innerHTML = msg;
      }
    }

    window.onload = function() {
      const lastClickDate = localStorage.getItem("last_click_date");
      const savedUser = localStorage.getItem("last_click_user");
      const today = getTodayString();

      if (lastClickDate === today) {
        if (savedUser) {
          document.getElementById("username").value = savedUser;
        }
        lockUI(`🔒 此手機今日已完成報到，無法再次點擊。`);
      }
    };

    function submitCheckIn() {
      const usernameInput = document.getElementById("username");
      const statusDiv = document.getElementById("statusMessage");
      const debugBox = document.getElementById("debugBox");
      const username = usernameInput.value.trim();

      if (!username) {
        alert("請輸入姓名！");
        return;
      }

      if (!navigator.geolocation) {
        alert("您的裝置不支援 GPS 定位功能。");
        return;
      }

      const today = getTodayString();
      localStorage.setItem("last_click_date", today);
      localStorage.setItem("last_click_user", username);
      lockUI();

      statusDiv.className = "info";
      statusDiv.innerHTML = "📡 正在進行多重 GPS 精密對焦 (請保持手機靜止 5 秒)...";

      let bestPosition = null;
      let watchId = null;

      watchId = navigator.geolocation.watchPosition(
        function(position) {
          // 保留 accuracy 數值最小（最精準）的資料
          if (!bestPosition || position.coords.accuracy < bestPosition.coords.accuracy) {
            bestPosition = position;
            statusDiv.innerHTML = `📡 正在精準對焦... (GPS 誤差: ${Math.round(position.coords.accuracy)} 公尺)`;
          }
        },
        function(error) {
          console.warn("GPS 擷取提醒:", error);
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );

      // 預熱對焦 5.5 秒後送出
      setTimeout(() => {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
        }

        if (bestPosition) {
          const lat = bestPosition.coords.latitude;
          const lng = bestPosition.coords.longitude;
          const accuracy = Math.round(bestPosition.coords.accuracy);
          const deviceId = getHardwareFingerprint();

          statusDiv.innerHTML = "驗證定位資料中...";

          const requestUrl = `${WEB_APP_URL}?username=${encodeURIComponent(username)}&lat=${lat}&lng=${lng}&device=${encodeURIComponent(deviceId)}`;

          fetch(requestUrl)
            .then(response => response.json())
            .then(data => {
              debugBox.style.display = "block";
              debugBox.innerHTML = `📌 實測定位：${lat.toFixed(6)}, ${lng.toFixed(6)}<br>衛星精確度誤差：±${accuracy} 公尺`;

              if (data.status === "success" && data.isSuccess) {
                statusDiv.className = "success";
                statusDiv.innerHTML = `✅ ${data.message} (距離標的物約 ${data.distance} 公尺)`;
              } else {
                statusDiv.className = "error";
                statusDiv.innerHTML = `❌ ${data.message || '報到失敗'}`;
              }
            })
            .catch(error => {
              console.error("Fetch error:", error);
              statusDiv.className = "error";
              statusDiv.innerHTML = "❌ 傳輸失敗，但今日報到次數已使用。";
            });
        } else {
          statusDiv.className = "error";
          statusDiv.innerHTML = "❌ 無法獲取定位，請確認 Safari 是否已開啟「精確位置」權限。";
        }
      }, 5500);
    }
  </script>
</body>
</html>
