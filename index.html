<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時定位簽到系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #6c757d;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .success {
      color: #28a745;
      font-weight: bold;
    }
    .error {
      color: #dc3545;
      font-weight: bold;
    }
    .info {
      color: #17a2b8;
    }
    .notice {
      font-size: 12px;
      color: #8c98a4;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 快速簽到系統</h2>
    <div class="form-group">
      <label for="username">請輸入您的姓名</label>
      <input type="text" id="username" placeholder="例：8號髮粧" required>
    </div>
    <button id="checkInBtn" onclick="submitCheckIn()">獨立定位簽到</button>
    <div id="statusMessage"></div>
    <div class="notice">🔒 系統已啟用雙重防護，每台手機每日僅可簽到一次</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFW4GyscWx1j1SMy-6B9Vys3HEfkb9qBzApekFvH0RUvd_nkTio7kHQ_mlmUBavOsn/exec";

    // 產生或讀取這台手機的硬體唯一 ID (即便開無痕分頁也會儘可能維持)
    function getDeviceId() {
      let devId = localStorage.getItem("device_fingerprint");
      if (!devId) {
        devId = 'DEV-' + Math.random().toString(36).substring(2, 10) + '-' + new Date().getTime().toString(36);
        localStorage.setItem("device_fingerprint", devId);
      }
      return devId;
    }

    function submitCheckIn() {
      const usernameInput = document.getElementById("username");
      const btn = document.getElementById("checkInBtn");
      const statusDiv = document.getElementById("statusMessage");
      const username = usernameInput.value.trim();

      if (!username) {
        alert("請輸入姓名！");
        return;
      }

      if (!navigator.geolocation) {
        alert("您的裝置不支援 GPS 定位功能。");
        return;
      }

      btn.disabled = true;
      statusDiv.className = "info";
      statusDiv.innerHTML = "正在獲取 GPS 定位資訊中...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const deviceId = getDeviceId();

          statusDiv.innerHTML = "驗證裝置與定位資訊中...";

          const requestUrl = `${WEB_APP_URL}?username=${encodeURIComponent(username)}&lat=${lat}&lng=${lng}&device=${encodeURIComponent(deviceId)}`;

          fetch(requestUrl)
            .then(response => response.json())
            .then(data => {
              if (data.status === "success") {
                if (data.isSuccess) {
                  statusDiv.className = "success";
                  statusDiv.innerHTML = `✅ ${data.message} (距離標的物約 ${data.distance} 公尺)`;
                  usernameInput.disabled = true;
                  btn.disabled = true;
                } else {
                  btn.disabled = false;
                  statusDiv.className = "error";
                  statusDiv.innerHTML = `❌ ${data.message}`;
                }
              } else {
                btn.disabled = false;
                statusDiv.className = "error";
                // 這裡會顯示後端阻擋代簽的訊息
                statusDiv.innerHTML = `❌ 簽到失敗：${data.message}`;
              }
            })
            .catch(error => {
              console.error("Fetch error:", error);
              btn.disabled = false;
              statusDiv.className = "error";
              statusDiv.innerHTML = "❌ 網路傳輸失敗，請再試一次。";
            });
        },
        function(error) {
          btn.disabled = false;
          statusDiv.className = "error";
          statusDiv.innerHTML = "❌ 無法獲取定位，請確認已開啟權限。";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }
  </script>
</body>
</html>
