<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時定位簽到系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #6c757d;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #6c757d !important;
      cursor: not-allowed;
      opacity: 0.6;
    }
    #statusMessage {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .success {
      color: #28a745;
      font-weight: bold;
    }
    .error {
      color: #dc3545;
      font-weight: bold;
    }
    .info {
      color: #17a2b8;
    }
    .notice {
      font-size: 12px;
      color: #8c98a4;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 快速簽到系統</h2>
    <div class="form-group">
      <label for="username">請輸入您的姓名</label>
      <input type="text" id="username" placeholder="例：8號髮粧" required>
    </div>
    <button id="checkInBtn" onclick="submitCheckIn()">獨立定位簽到</button>
    <div id="statusMessage"></div>
    <div class="notice">🔒 雙重防護：同一網路/手機每日僅能簽到一次</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzcwB2aGzcoueMr6Qxt72G7juOL0ipyK4A73kdcKGh5nMIvZ9AL1pL7LRciR_k0xOvz/exec";

    function getTodayString() {
      const today = new Date();
      return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    }

    function lockUI(msg) {
      const btn = document.getElementById("checkInBtn");
      const usernameInput = document.getElementById("username");
      const statusDiv = document.getElementById("statusMessage");

      btn.disabled = true;
      usernameInput.disabled = true;
      if (msg) {
        statusDiv.className = "info";
        statusDiv.innerHTML = msg;
      }
    }

    window.onload = function() {
      const lastClickDate = localStorage.getItem("last_click_date");
      const savedUser = localStorage.getItem("last_click_user");
      const today = getTodayString();

      if (lastClickDate === today) {
        if (savedUser) {
          document.getElementById("username").value = savedUser;
        }
        lockUI(`🔒 本手機今日已完成簽到，按鈕已鎖定。`);
      }
    };

    // 取得手機目前的真實對外 IP 位址
    async function getUserIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        return data.ip;
      } catch (e) {
        return 'IP-' + Math.random().toString(36).substring(2, 8);
      }
    }

    async function submitCheckIn() {
      const usernameInput = document.getElementById("username");
      const statusDiv = document.getElementById("statusMessage");
      const username = usernameInput.value.trim();

      if (!username) {
        alert("請輸入姓名！");
        return;
      }

      if (!navigator.geolocation) {
        alert("您的裝置不支援 GPS 定位功能。");
        return;
      }

      // 點擊後先記錄在本地（提供即時 UI 鎖定）
      const today = getTodayString();
      localStorage.setItem("last_click_date", today);
      localStorage.setItem("last_click_user", username);
      lockUI();

      statusDiv.className = "info";
      statusDiv.innerHTML = "正在驗證網路 IP 與獲取 GPS 定位資訊中...";

      try {
        // 抓取 IP 位址
        const clientIp = await getUserIP();

        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            statusDiv.innerHTML = "傳送簽到資料中...";

            const requestUrl = `${WEB_APP_URL}?username=${encodeURIComponent(username)}&lat=${lat}&lng=${lng}&ip=${encodeURIComponent(clientIp)}`;

            fetch(requestUrl)
              .then(response => response.json())
              .then(data => {
                if (data.status === "success" && data.isSuccess) {
                  statusDiv.className = "success";
                  statusDiv.innerHTML = `✅ ${data.message} (距離標的物約 ${data.distance} 公尺)`;
                } else {
                  statusDiv.className = "error";
                  statusDiv.innerHTML = `❌ ${data.message || '簽到失敗'}`;
                }
              })
              .catch(error => {
                console.error("Fetch error:", error);
                statusDiv.className = "error";
                statusDiv.innerHTML = "❌ 傳輸失敗，但今日簽到次數已使用。";
              });
          },
          function(error) {
            statusDiv.className = "error";
            statusDiv.innerHTML = "❌ 無法獲取定位，今日簽到次數已使用。";
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.innerHTML = "❌ 網路驗證錯誤，請重試。";
      }
    }
  </script>
</body>
</html>
