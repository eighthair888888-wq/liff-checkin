<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時定位簽到系統</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #6c757d;
      font-size: 14px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #007bff;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    .success {
      color: #28a745;
      font-weight: bold;
    }
    .error {
      color: #dc3545;
      font-weight: bold;
    }
    .info {
      color: #17a2b8;
    }
    .notice {
      font-size: 12px;
      color: #8c98a4;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📍 快速簽到系統</h2>
    <div class="form-group">
      <label for="username">請輸入您的姓名</label>
      <input type="text" id="username" placeholder="例：王小明" required>
    </div>
    <button id="checkInBtn" onclick="submitCheckIn()">獨立定位簽到</button>
    <div id="statusMessage"></div>
    <div class="notice">🔒 每台手機每日僅可完成一次簽到</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxApjuQXiRoOSRfLO5LllzG6prsxqYaeUDb4g44KeLZK6RntkwCAuJXpOI-aP72h9nE/exec";

    // 取得今天日期的字串 (格式: YYYY-MM-DD)
    function getTodayString() {
      const today = new Date();
      return today.toISOString().split('T')[0];
    }

    // 頁面載入時，檢查今日是否已簽到過
    window.onload = function() {
      checkDailyLock();
    };

    function checkDailyLock() {
      const savedDate = localStorage.getItem("checkin_date");
      const savedUser = localStorage.getItem("checkin_user");
      const today = getTodayString();

      // 如果紀錄的日期是「今天」，阻擋再次簽到
      if (savedDate === today) {
        const btn = document.getElementById("checkInBtn");
        const statusDiv = document.getElementById("statusMessage");
        const usernameInput = document.getElementById("username");

        btn.disabled = true;
        usernameInput.value = savedUser || "";
        usernameInput.disabled = true;

        statusDiv.className = "info";
        statusDiv.innerHTML = `🔒 此裝置今日已完成「${savedUser}」的簽到。<br>同一台手機每日僅限簽到一次。`;
        return true;
      }
      return false;
    }

    function submitCheckIn() {
      if (checkDailyLock()) return;

      const usernameInput = document.getElementById("username");
      const btn = document.getElementById("checkInBtn");
      const statusDiv = document.getElementById("statusMessage");
      const username = usernameInput.value.trim();

      if (!username) {
        alert("請輸入姓名！");
        return;
      }

      if (!navigator.geolocation) {
        alert("您的裝置或瀏覽器不支援 GPS 定位功能。");
        return;
      }

      btn.disabled = true;
      statusDiv.className = "info";
      statusDiv.innerHTML = "正在獲取 GPS 定位資訊中...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          statusDiv.innerHTML = "獲取定位成功，傳送資料至雲端硬碟...";

          const requestUrl = `${WEB_APP_URL}?username=${encodeURIComponent(username)}&lat=${lat}&lng=${lng}`;

          fetch(requestUrl)
            .then(response => response.json())
            .then(data => {
              if (data.status === "success") {
                if (data.isSuccess) {
                  // 簽到成功：寫入今日日期與姓名至瀏覽器 localStorage
                  localStorage.setItem("checkin_date", getTodayString());
                  localStorage.setItem("checkin_user", username);

                  statusDiv.className = "success";
                  statusDiv.innerHTML = `✅ ${data.message} (距離標的物約 ${data.distance} 公尺)`;
                  usernameInput.disabled = true;
                  btn.disabled = true;
                } else {
                  btn.disabled = false;
                  statusDiv.className = "error";
                  statusDiv.innerHTML = `❌ ${data.message}`;
                }
              } else {
                btn.disabled = false;
                statusDiv.className = "error";
                statusDiv.innerHTML = `❌ 簽到失敗：${data.message}`;
              }
            })
            .catch(error => {
              console.error("Fetch error:", error);
              btn.disabled = false;
              statusDiv.className = "error";
              statusDiv.innerHTML = "❌ 網路傳輸失敗，請確認存取權限已開啟為「任何人」。";
            });
        },
        function(error) {
          btn.disabled = false;
          statusDiv.className = "error";
          switch (error.code) {
            case error.PERMISSION_DENIED:
              statusDiv.innerHTML = "❌ 您已拒絕提供定位權限，請於瀏覽器設定中開啟。";
              break;
            case error.POSITION_UNAVAILABLE:
              statusDiv.innerHTML = "❌ 無法取得目前的定位資訊。";
              break;
            case error.TIMEOUT:
              statusDiv.innerHTML = "❌ 定位請求超時，請重試。";
              break;
            default:
              statusDiv.innerHTML = "❌ 定位發生未知錯誤。";
              break;
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
